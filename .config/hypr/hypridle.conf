general {
    lock_cmd = LC_TIME=en_US.UTF-8 hyprlock         # dbus/sysd lock command (loginctl lock-session)
    unlock_cmd =       # same as above, but unlock
    before_sleep_cmd = LC_TIME=en_US.UTF-8 hyprlock # command ran before sleep
    after_sleep_cmd = hyprctl dispatch dpms on   # command ran after sleep
    ignore_dbus_inhibit = false             # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false          # whether to ignore systemd-inhibit --what=idle inhibitors
}

#lock
listener {
    timeout = 600                            # in seconds
    on-timeout = LC_TIME=en_US.UTF-8 hyprlock # command to run when timeout has passed
}

#screen off
listener {
    timeout = 900                           # in seconds
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
